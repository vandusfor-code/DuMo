# Railway: Root Directory = services/web-qr-bridge
# Build: Dockerfile (Node 20) — alternativa Nixpacks vía .nvmrc + nixpacks.toml
# Volumen: /data/sessions + SESSIONS_DIR=/data/sessions

[build]
builder = "dockerfile"
dockerfilePath = "Dockerfile"

[deploy]
startCommand = "npm start"
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 10

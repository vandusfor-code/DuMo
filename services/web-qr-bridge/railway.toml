# Railway: Root Directory = services/web-qr-bridge (no la raíz del monorepo DuMo)
# Volumen en /data/sessions + SESSIONS_DIR=/data/sessions
# Node 20+ obligatorio (Baileys 7) — ver package.json engines, .nvmrc, nixpacks.toml

[build]
builder = "nixpacks"
buildCommand = "npm ci"

[deploy]
startCommand = "npm start"
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 10

# DuMo CRM — Fase 4 (repo root). Bridge usa services/web-qr-bridge/railway.toml

[build]
builder = "dockerfile"
dockerfilePath = "Dockerfile"

[deploy]
startCommand = "node server.js"
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 10
healthcheckPath = "/api/system/db"
healthcheckTimeout = 120
